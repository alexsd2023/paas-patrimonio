# PLANTILLA de servicio. No la edites aquí: crea uno nuevo con
#   python scripts/nuevo_servicio.py mi-servicio "Nombre visible" --modo integrada|alojada|externa
id: __ID__
nombre: __NOMBRE__
resumen: Qué hace, en una línea
autor: Quién lo mantiene
tipo: tarea                  # tarea (procesa un documento) | consulta (pregunta → respuesta, p. ej. un RAG)
entrada: transcripcion       # uno de contracts/tipos: texto, transcripcion, transcripcion-anotada, texto-modernizado, pregunta
salida: transcripcion        # idem; respuesta para un RAG
version: 0.1.0
modo: __MODO__               # integrada (equipo del PaaS) · alojada (tuya, en la plataforma): un contenedor (app.py)
                             # externa: una API que ya existe, fuera de la plataforma (adaptador.py); el texto sale
# url: https://...           # obligatoria si es externa; si no, por defecto http://srv-<id>:8080
# externo: {ruta: /predict, token_env: MI_TOKEN, espera_s: 60}
parametros: {}
#  modelo: {tipo: texto, valores: [a, b], defecto: a, descripcion: "..."}
acceso: [registrado]         # registrado · rol:<rol> · institucion:<id>
cuota: {trabajos_dia: 1000}
