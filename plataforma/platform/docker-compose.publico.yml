# Perfil público: la demo abierta en un VPS. Se monta ENCIMA de docker-compose.yml sin cambiarlo
# (Turing y la red local siguen igual).
#
# Uso, en plataforma/ del VPS:
#   docker compose --env-file platform/.env -f platform/docker-compose.yml -f platform/docker-compose.publico.yml up -d --build
#
# Qué cambia respecto al compose normal:
#   · Caddy es la única puerta: 80/443 con HTTPS automático (Let's Encrypt).
#       ${DOMINIO}       → APISIX (consola y API)
#       ${AUTH_DOMINIO}  → Keycloak (inicio de sesión y tokens; su /admin bloqueado salvo desde ADMIN_IP)
#   · Ningún otro servicio publica puertos (Docker se salta ufw: por eso se quitan aquí, no en el cortafuegos).
#   · Keycloak sabe que va detrás de un proxy HTTPS.
#   · La cookie de la consola sale con «Secure» (lo añade Caddy; el código no cambia).
#   · El Marketplace no enseña precios (MOSTRAR_PRECIOS=no).
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en platform/.env}
      AUTH_DOMINIO: ${AUTH_DOMINIO:?Define AUTH_DOMINIO en platform/.env}
      NEO4J_DOMINIO: ${NEO4J_DOMINIO:?Define NEO4J_DOMINIO en platform/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en platform/.env}
      ADMIN_IP: ${ADMIN_IP:-127.0.0.1/32}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - /var/log/caddy:/var/log/caddy     # registro de accesos (visitas.sh)
    depends_on:
      - apisix
      - keycloak
      - neo4j

  keycloak:
    ports: !reset []
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"

  panel:
    environment:
      MOSTRAR_PRECIOS: "no"     # la demo pública no enseña precios en el Marketplace

  apisix:
    ports: !reset []
  kafka:
    ports: !reset []
  puente:
    ports: !reset []
  procedencia:
    ports: !reset []
  gestoria:
    ports: !reset []
  mlflow:
    ports: !reset []
  scorpio:
    ports: !reset []
  fuseki:
    ports: !reset []
  jaeger:
    ports: !reset []

  neo4j:
    # Grafo (Neo4j Community). Desde internet, por Caddy: https://NEO4J_DOMINIO (Browser) y
    # bolt+s://NEO4J_DOMINIO:443 (conexión). Dentro de la plataforma: bolt://neo4j:7687.
    # Los puertos de abajo solo existen en 127.0.0.1 del VPS (túnel SSH), no en internet.
    image: neo4j:2026-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en platform/.env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j-data:/data
    ports:
      - "127.0.0.1:7474:7474"     # Neo4j Browser
      - "127.0.0.1:7687:7687"     # Bolt
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7687'"]
      interval: 15s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  neo4j-data:
