# Servicios del walking skeleton · se ejecuta en el servidor Ubuntu
# Parte 1: Kafka (KRaft, un nodo que hace de broker y de controlador)
# Parte 4: puente NGSI-LD → CloudEvents
# Parte 5: consumidores (procedencia y gestoría)
# Parte 6: catastro (Scorpio + PostGIS) y su suscripción al puente
# Parte 7: procesos (Temporal), taller de copistas (HTR simulado) y su trabajador
name: paas

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"            # acceso desde el Mac (EXTERNAL)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:?Define KAFKA_HOST en platform/.env}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in activos htr; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
      done
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  puente:
    build:
      context: ..
      dockerfile: services/puente/Dockerfile
    container_name: puente
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "${PUENTE_PORT:-8080}:8080"   # puerto en el servidor (cámbialo en .env si el 8080 está ocupado)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5


  procedencia:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: procedencia }
    container_name: procedencia
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      PROCEDENCIA_RUTA: /data/procedencia.ttl
    volumes:
      - procedencia-data:/data
    ports:
      - "${PROCEDENCIA_PORT:-8089}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  gestoria:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: gestoria }
    container_name: gestoria
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TEMPORAL: temporal:7233
    volumes:
      - gestoria-data:/data
    ports:
      - "${GESTORIA_PORT:-8090}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4
    container_name: scorpio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    volumes:
      - scorpio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngb -d ngb"]
      interval: 5s
      retries: 30

  scorpio:
    image: scorpiobroker/all-in-one-runner:java-latest
    container_name: scorpio
    restart: unless-stopped
    environment:
      DBHOST: postgres
    ports:
      - "${SCORPIO_PORT:-9090}:9090"   # catastro, accesible desde el Mac para las pruebas
    depends_on:
      postgres:
        condition: service_healthy

  suscripciones:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: suscripciones }
    restart: "no"
    command: ["python", "-m", "services.suscripciones.crear"]
    environment:
      SCORPIO_URL: http://scorpio:9090
      PUENTE_INTERNO: http://puente:8080
      TENANTS: archivo-villanueva,otro-archivo
    depends_on:
      scorpio:
        condition: service_started
      puente:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    container_name: temporal
    restart: unless-stopped
    user: "0:0"    # para poder escribir en el volumen /data
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    volumes:
      - temporal-data:/data
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8233"   # interfaz web de Temporal (ver los procesos)

  htr:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: htr }
    container_name: htr
    restart: unless-stopped
    environment:
      SCORPIO_URL: http://scorpio:9090
      KAFKA_BOOTSTRAP: kafka:29092
      MODELO: htr-mock@0.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      scorpio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  procesos:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: procesos }
    container_name: procesos
    restart: unless-stopped
    command: ["python", "-m", "services.procesos.worker"]
    environment:
      TEMPORAL: temporal:7233
      HTR_URL: http://htr:8080
      SCORPIO_URL: http://scorpio:9090
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      temporal:
        condition: service_started
      htr:
        condition: service_healthy

volumes:
  kafka-data:
  procedencia-data:
  gestoria-data:
  scorpio-db:
  temporal-data:
