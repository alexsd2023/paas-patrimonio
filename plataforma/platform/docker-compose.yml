# Servicios del walking skeleton · se ejecuta en el servidor Ubuntu
# Parte 1: Kafka (KRaft, un nodo que hace de broker y de controlador)
# Parte 4: puente NGSI-LD → CloudEvents
# Parte 5: consumidores (procedencia y gestoría)
# Parte 6: catastro (Scorpio + PostGIS) y su suscripción al puente
# Parte 7: procesos (Temporal), taller de copistas (HTR simulado) y su trabajador
# Parte 8: la puerta (Keycloak + APISIX)
# Parte 9: la sala de lectura (adaptador IIIF)
# Vistas: panel del esqueleto (por la puerta, /panel) y Kafka UI (cartas del bus)
# Gemelo digital: sensores simulados de los depósitos y servicio de conservación
# Parte 10: el libro del notario en Jena Fuseki (un grafo por institución)
# Parte 11: trazas (OpenTelemetry → Jaeger)
name: paas

services:
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    ports:
      - "9092:9092"            # acceso desde el Mac (EXTERNAL)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:?Define KAFKA_HOST en platform/.env}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      for t in activos htr sensores conservacion flujos conectores; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
      done
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  puente:
    build:
      context: ..
      dockerfile: services/puente/Dockerfile
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: puente
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "${PUENTE_PORT:-8080}:8080"   # puerto en el servidor (cámbialo en .env si el 8080 está ocupado)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5


  procedencia:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: procedencia }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: procedencia
      KAFKA_BOOTSTRAP: kafka:29092
      PROCEDENCIA_RUTA: /data/procedencia.ttl     # solo se usa si no hay Fuseki
      FUSEKI_URL: http://fuseki:3030
      FUSEKI_DATASET: paas
      FUSEKI_USUARIO: admin
      FUSEKI_CLAVE: ${FUSEKI_ADMIN_PASSWORD:-admin}
    volumes:
      - procedencia-data:/data
    ports:
      - "${PROCEDENCIA_PORT:-8089}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  gestoria:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: gestoria }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: gestoria
      KAFKA_BOOTSTRAP: kafka:29092
      TEMPORAL: temporal:7233
      KEYCLOAK_JWKS: http://keycloak:8080/realms/paas/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}/realms/paas
    volumes:
      - gestoria-data:/data
    ports:
      - "${GESTORIA_PORT:-8090}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  catalogo:
    # Núcleo: catálogo de capacidades (servicios, motor de flujos con su worker) y de conectores
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: catalogo }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: catalogo
      KAFKA_BOOTSTRAP: kafka:29092
      TEMPORAL: temporal:7233
      SCORPIO_URL: http://scorpio:9090
      KEYCLOAK_JWKS: http://keycloak:8080/realms/paas/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}/realms/paas
      CATALOGO_DB: /data/flujos.db
      CONECTORES_DB: /data/conectores.db
      SECRETOS_DB: /data/secretos.db     # secretos de las capacidades, cifrados (se ponen en la consola)
      CATALOGO_CLAVE: ${CATALOGO_CLAVE:-}   # clave Fernet; vacía = se genera una en el volumen
      NER_TOKEN: ${NER_TOKEN:-}          # opcional: valor de la plataforma si nadie lo pone en la consola
      # Ameyalli (Scriptorium): otro despliegue de su API y, opcionalmente, claves de la plataforma
      # (mejor en la consola: Mi institución → Secretos)
      AMEYALLI_URL: ${AMEYALLI_URL:-}
      SCRIPTORIUM_API_KEY: ${SCRIPTORIUM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - catalogo-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  srv-modernizador-demo:
    # Capacidad (servicio interno del catálogo), hecha con la plantilla: capacidades/modernizador_demo
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { CARPETA: capacidades, SERVICIO: modernizador_demo }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  mlflow:
    # Núcleo: registro de modelos. Cada versión dice de qué datos (DVC) y de qué run sale; el alias
    # «produccion» decide qué modelo usa cada servicio (hoy el HTR) sin reiniciar nada.
    build:
      context: ./mlflow
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 2
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "${MLFLOW_HOSTS:-mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1:*,192.168.*,10.*,172.*}"
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      retries: 10

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    volumes:
      - scorpio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngb -d ngb"]
      interval: 5s
      retries: 30

  scorpio:
    image: scorpiobroker/all-in-one-runner:java-latest
    restart: unless-stopped
    environment:
      DBHOST: postgres
    ports:
      - "${SCORPIO_PORT:-9090}:9090"   # catastro, accesible desde el Mac para las pruebas
    depends_on:
      postgres:
        condition: service_healthy

  suscripciones:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: suscripciones }
    restart: "no"
    command: ["python", "-m", "services.suscripciones.crear"]
    environment:
      SCORPIO_URL: http://scorpio:9090
      PUENTE_INTERNO: http://puente:8080
      TENANTS: archivo-villanueva,otro-archivo
    depends_on:
      scorpio:
        condition: service_started
      puente:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped
    user: "0:0"    # para poder escribir en el volumen /data
    # La interfaz web vive en /panel/temporal, detrás de la puerta (dentro de la consola); sin puerto propio.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db",
              "--ui-public-path", "/panel/temporal"]
    volumes:
      - temporal-data:/data

  htr:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: htr }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: htr
      SCORPIO_URL: http://scorpio:9090
      KAFKA_BOOTSTRAP: kafka:29092
      MODELO: htr-mock@0.1                       # solo si no hay modelo en producción en MLflow
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HTR_MODELO: htr-paleografico
    depends_on:
      mlflow:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      scorpio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  procesos:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: procesos }
    restart: unless-stopped
    command: ["python", "-m", "services.procesos.worker"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: procesos
      TEMPORAL: temporal:7233
      HTR_URL: http://htr:8080
      SCORPIO_URL: http://scorpio:9090
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      temporal:
        condition: service_started
      htr:
        condition: service_healthy

  keycloak-permisos:
    # El volumen de Keycloak nace de root; Keycloak escribe como el usuario 1000
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:0 /h2"]
    volumes:
      - keycloak-data:/h2

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    # --import-realm solo importa si el realm no existe: con el volumen, las instituciones dadas de alta
    # en la consola sobreviven a recrear el contenedor (y los cambios en realm-paas.json ya no se aplican solos)
    command: ["start-dev", "--import-realm"]
    environment:
      # secreto del cliente «paas-gestion» (el servicio de instituciones administra Keycloak con él)
      KC_GESTION_SECRET: ${PAAS_GESTION_SECRET:?Define PAAS_GESTION_SECRET en platform/.env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Emisor fijo = dirección pública (la que usa el Mac para pedir tokens);
      # los contenedores llegan por la red interna (keycloak:8080) gracias a backchannel-dynamic.
      KC_HOSTNAME: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-paas.json:/opt/keycloak/data/import/realm-paas.json:ro
      - keycloak-data:/opt/keycloak/data/h2      # usuarios, grupos y clientes (H2 de start-dev)
    depends_on:
      keycloak-permisos:
        condition: service_completed_successfully
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30

  apisix:
    image: apache/apisix:3.11.0-debian
    restart: unless-stopped
    environment:
      APISIX_STAND_ALONE: "true"   # el arranque de la imagen escribe su propio config.yaml en modo standalone
    volumes:
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"   # la puerta: única entrada para usuarios
    depends_on:
      keycloak:
        condition: service_healthy
      gestoria:
        condition: service_healthy
      iiif:
        condition: service_healthy
      panel:
        condition: service_healthy

  iiif:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: iiif }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: iiif
      SCORPIO_URL: http://scorpio:9090
      KEYCLOAK_JWKS: http://keycloak:8080/realms/paas/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}/realms/paas
      IIIF_PUBLICO: ${API_PUBLICO:?Define API_PUBLICO en platform/.env}   # las URL de manifiestos e imágenes
      IIIF_DATOS: /data
    volumes:
      - iiif-data:/data
    depends_on:
      scorpio:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  instituciones:
    # Núcleo: alta autoservicio de instituciones, sus personas, productos activados y credenciales de API
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: instituciones }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: instituciones
      KEYCLOAK_INTERNO: http://keycloak:8080
      KEYCLOAK_JWKS: http://keycloak:8080/realms/paas/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}/realms/paas
      GESTION_SECRET: ${PAAS_GESTION_SECRET:?Define PAAS_GESTION_SECRET en platform/.env}
      REGISTRO: ${REGISTRO:-abierto}     # abierto | cerrado (entonces solo el equipo del PaaS da altas)
      INSTITUCIONES_DB: /data/instituciones.db
    volumes:
      - instituciones-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  panel:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: panel }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: panel
      SCORPIO_URL: http://scorpio:9090
      TEMPORAL: temporal:7233
      KEYCLOAK_INTERNO: http://keycloak:8080
      KEYCLOAK_JWKS: http://keycloak:8080/realms/paas/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLICO:?Define KEYCLOAK_PUBLICO en platform/.env}/realms/paas
      API_PUBLICO: ${API_PUBLICO:?Define API_PUBLICO en platform/.env}
      CONSERVACION_INTERNO: http://conservacion:8080
      SENSORES_INTERNO: http://sensores:8080
      # consola del núcleo: mira los buzones del bus y enlaza las consolas de cada pieza
      KAFKA_BOOTSTRAP: kafka:29092
      SCORPIO_PUBLICO: ${SCORPIO_PUBLICO:-}
      KEYCLOAK_PUBLICO: ${KEYCLOAK_PUBLICO}
    depends_on:
      keycloak:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/panel')"]
      interval: 10s
      retries: 5

  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: paas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "true"      # solo mirar: no se pueden borrar ni enviar mensajes
      DYNAMIC_CONFIG_ENABLED: "false"
      SERVER_SERVLET_CONTEXT_PATH: /panel/kafka   # vive en /panel/kafka, detrás de la puerta; sin puerto propio
    depends_on:
      kafka:
        condition: service_healthy

  sensores:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: sensores }
    restart: unless-stopped
    environment:
      SCORPIO_URL: http://scorpio:9090
      INTERVALO: "5"            # segundos entre lecturas
    depends_on:
      scorpio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  conservacion:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args: { SERVICIO: conservacion }
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: conservacion
      SCORPIO_URL: http://scorpio:9090
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/salud')"]
      interval: 10s
      retries: 5

  fuseki:
    image: stain/jena-fuseki:latest
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
      TDB: "2"
      FUSEKI_DATASET_1: paas
      JVM_ARGS: -Xmx1g
    volumes:
      - fuseki-data:/fuseki
    ports:
      - "${FUSEKI_PORT:-3030}:3030"   # interfaz web y SPARQL (red local)

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"     # en memoria: las trazas se pierden al reiniciar
      QUERY_BASE_PATH: /panel/jaeger # la interfaz vive en /panel/jaeger (dentro de la consola)
    ports:
      - "${JAEGER_PORT:-16686}:16686"   # API para traza_check desde el Mac: http://servidor:16686/panel/jaeger

volumes:
  keycloak-data:
  instituciones-data:
  mlflow-data:
  catalogo-data:
  kafka-data:
  procedencia-data:
  gestoria-data:
  scorpio-db:
  temporal-data:
  iiif-data:
  fuseki-data:
